name: CI Workflow for AWS Lambda

on:
  push:
    branches:
      - pre-release


jobs:

  validate:
    name: Validate Lambda Package
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          rm -rf package
          mkdir package

          pip install \
            -r requirements.txt \
            -t package


      - name: Copy Lambda source
        run: |
          cp -r src/* package/


      - name: Validate package structure
        run: |
          echo "==== Package content ===="
          ls -la package

          echo "==== Validate dotenv ===="
          python -c "import sys; sys.path.insert(0,'package'); import dotenv"

          echo "dotenv OK"


      - name: Validate Lambda imports
        run: |
          python -c "
          import sys
          sys.path.insert(0,'package')

          import main

          print('Lambda import OK')
          "


      - name: Create validation zip
        run: |
          cd package
          zip -r ../function.zip .

          cd ..

          echo "==== ZIP INFO ===="
          ls -lh function.zip



  deploy:

    name: Deploy AWS Lambda
    runs-on: ubuntu-latest

    needs: validate

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: sa-east-1



      - name: Download Lambda package
        uses: actions/download-artifact@v4

        with:
          name: lambda-package



      - name: Deploy to AWS Lambda
        env:
          AWS_REGION: sa-east-1

        run: |
          aws lambda update-function-code \
            --function-name ralplast-xml-upload \
            --zip-file fileb://function.zip \
            --region $AWS_REGION