name: CI Workflow for AWS Lambda

on:
  push:
    branches:
      - pre-release  # Especifica o branch que ativa o workflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies into package dir
        run: |
          set -e
          python -m pip install --upgrade pip
          rm -rf package
          mkdir -p package
          # Instala dependências diretamente no diretório package
          pip install --target ./package -r requirements.txt

      - name: Copy source into package
        run: |
          set -e
          # Ajuste se seu código lambda estiver em outro local que não 'src'
          if [ -d "src" ]; then
            # Copia todo o conteúdo de src para package (preserva subpastas)
            cp -r src/* package/ || true
          else
            echo "Diretório src não encontrado. Certifique-se de onde está o código da função."
            exit 1
          fi

      - name: Create function.zip in workspace root
        run: |
          set -e
          # Remove ZIP antigo se existir
          rm -f function.zip
          # Vai para package e zipa todo o conteúdo, gerando function.zip na raiz
          cd package
          zip -r ../function.zip .
          cd ..
          echo "Created function.zip with size:"
          ls -lh function.zip

      - name: Configure AWS creds (optional)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Deploy to AWS Lambda
        env:
          AWS_REGION: 'sa-east-1'
        run: |
          set -e
          # Debug: mostrar arquivo antes do deploy
          ls -la function.zip
          aws lambda update-function-code --function-name ralplast-xml-upload --zip-file fileb://function.zip --region $AWS_REGION
